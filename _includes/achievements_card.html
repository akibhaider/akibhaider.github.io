<div class="life-event-card" id="{{ include.id }}">
  <div class="life-event-date">{{ include.date }}</div>
  <img class="life-event-img" src="{{ include.img }}" alt="{{ include.title }}" />
  <div class="life-event-title">{{ include.title }}</div>
  <div class="life-event-desc">{{ include.desc }}</div>
  <button class="life-event-share" title="Share this post" onclick="copyLifeEventLink('{{ include.id }}')">
    <svg width="22" height="22" fill="none" stroke="#40bfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
  </button>
</div>

<script>
function copyLifeEventLink(postId) {
  const url = window.location.origin + window.location.pathname + '#' + postId;
  navigator.clipboard.writeText(url);
  const btn = document.querySelector(`#${postId} .life-event-share`);
  btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#40bfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  setTimeout(() => {
    btn.innerHTML = `<svg width="22" height="22" fill="none" stroke="#40bfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>`;
  }, 1200);
}
</script>

<style>
:root {
  --card-desc-color: #222;
  --accent-color: #40bfff;
  --date-color: #cc0000;
}
[data-theme="dark"] {
  --card-desc-color: #fff;
  --accent-color: #40bfff;
  --date-color: #f4b084;
}
.life-event-card {
  max-width: 737px;
  margin: 2rem auto;
  border: 2px solid #fff;
  border-radius: 18px;
  background: none;
  box-shadow: 0 8px 32px 0 rgba(31,38,135,0.15);
  color: var(--text-color, #222);
  padding: 0.3rem 0.5rem 0.3rem 0.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background 0.3s, color 0.3s;
  position: relative;
  font-family: inherit;
  font-weight: inherit;
}
.life-event-date {
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--date-color);
  margin-bottom: 0.7rem;
  text-align: center;
}
.life-event-img {
  width: 100%;
  max-width: 560px;
  border-radius: 12px;
  margin-bottom: 1rem;
  object-fit: cover;
  background: var(--card-img-bg, #222);
}
.life-event-title {
  font-size: 1.25rem;
  font-weight: bold;
  color: var(--accent-color, #40bfff);
  margin-bottom: 0.5rem;
  text-align: center;
}
.life-event-desc {
  font-size: 1rem;
  color: var(--card-desc-color, #222);
  margin-bottom: 1.2rem;
  text-align: center;
}
.life-event-share {
  background: none;
  border: none;
  cursor: pointer;
  position: absolute;
  top: 0.5rem;
  right: 1.2rem;
  padding: 0.2rem;
  border-radius: 50%;
  transition: background 0.2s;
}
.life-event-share:hover {
  background: rgba(64,191,255,0.12);
}
@media (max-width: 800px) {
  .life-event-card { max-width: 98vw; }
  .life-event-img { max-width: 100%; }
}
</style>
