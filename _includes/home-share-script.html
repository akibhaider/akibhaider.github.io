<script>
(function () {
  var copyText = function (text) {
    if (navigator.clipboard && window.isSecureContext) { return navigator.clipboard.writeText(text); }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try {
        if (!document.execCommand('copy')) { throw new Error('Copy failed'); }
        resolve();
      } catch (err) { reject(err); }
      finally { document.body.removeChild(ta); }
    });
  };

  // Temporarily swaps a button's content, then restores it.
  var flash = function (btn, html) {
    var original = btn.innerHTML;
    btn.innerHTML = html;
    setTimeout(function () { btn.innerHTML = original; }, 1500);
  };

  window.homeUtil = { copyText: copyText, flash: flash };

  window.homeCopyLink = function (id, btn) {
    copyText(window.location.origin + window.location.pathname + '#' + id).then(function () {
      flash(btn, '<i class="fa-solid fa-check" aria-hidden="true"></i>');
    }).catch(function () {
      window.prompt('Copy this link:', window.location.origin + window.location.pathname + '#' + id);
    });
  };

  function centerSharedCard() {
    var id;
    try { id = decodeURIComponent(window.location.hash.slice(1)); } catch (err) { return; }
    var card = document.getElementById(id);
    if (card && card.classList.contains('home-pub')) {
      card.scrollIntoView({ block: 'center', inline: 'nearest' });
    }
  }

  window.addEventListener('load', centerSharedCard);
  window.addEventListener('hashchange', centerSharedCard);
})();
</script>
