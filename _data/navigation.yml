# Top bar. `brand` is the left-most link (scrolls to the top of the home page).
# `main` links are shown on the right, in order. In-page links use /#section-id.
# Set `new_tab: true` to open a link in a new browser tab.

brand:
  title: "About"
  url: /#home

main:
  - title: "News"
    url: /#news
  - title: "Publications"
    url: /#publications
  - title: "Awards"
    url: /#awards
  - title: "Services"
    url: /#services
  - title: "Projects"
    url: /#projects
  - title: "CV"
    url: /files/resume.pdf
    new_tab: true
